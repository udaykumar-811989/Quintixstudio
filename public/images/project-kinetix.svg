<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Abstract high-energy athletic composition with motion streaks">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101014" />
      <stop offset="0.5" stop-color="#08080a" />
      <stop offset="1" stop-color="#050506" />
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c9d4" stop-opacity="0" />
      <stop offset="0.45" stop-color="#f2f2f7" stop-opacity="0.85" />
      <stop offset="1" stop-color="#8a8a96" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="slab" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e6ee" />
      <stop offset="0.5" stop-color="#75757f" />
      <stop offset="1" stop-color="#1c1c22" />
    </linearGradient>
    <filter id="grain3">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="10" /></filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg3)" />

  <!-- diagonal speed field -->
  <g transform="rotate(-22 600 750)">
    <rect x="-300" y="520" width="2000" height="8" fill="url(#streak)" opacity="0.75" />
    <rect x="-300" y="600" width="2000" height="3" fill="url(#streak)" opacity="0.5" />
    <rect x="-300" y="680" width="2000" height="14" fill="url(#streak)" opacity="0.35" filter="url(#blur3)" />
    <rect x="-300" y="800" width="2000" height="5" fill="url(#streak)" opacity="0.6" />
    <rect x="-300" y="900" width="2000" height="9" fill="url(#streak)" opacity="0.3" />
    <rect x="-300" y="1010" width="2000" height="2" fill="url(#streak)" opacity="0.55" />
  </g>

  <!-- chrome monolith mid-stride -->
  <g transform="translate(600 780)">
    <ellipse cx="0" cy="430" rx="240" ry="46" fill="#000" opacity="0.6" filter="url(#blur3)" />
    <g transform="rotate(9)">
      <rect x="-95" y="-420" width="190" height="880" rx="10" fill="url(#slab)" />
      <rect x="-95" y="-420" width="190" height="880" rx="10" fill="none" stroke="#f2f2f7" stroke-opacity="0.35" stroke-width="2" />
      <rect x="-58" y="-380" width="26" height="800" rx="13" fill="#ffffff" opacity="0.22" />
    </g>
    <!-- motion echo -->
    <g opacity="0.25">
      <rect x="-240" y="-360" width="90" height="740" rx="8" fill="#8a8a96" />
      <rect x="-360" y="-300" width="60" height="620" rx="8" fill="#5b5b66" />
    </g>
  </g>

  <!-- pulse rings -->
  <g fill="none" stroke="#c9c9d4" stroke-opacity="0.16" stroke-width="2">
    <circle cx="600" cy="760" r="330" />
    <circle cx="600" cy="760" r="450" />
  </g>

  <!-- baseline -->
  <line x1="80" y1="1380" x2="1120" y2="1380" stroke="#f2f2f7" stroke-opacity="0.25" stroke-width="2" />

  <rect width="1200" height="1500" filter="url(#grain3)" opacity="0.07" />
</svg>
