<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-label="Abstract fine-dining composition with metallic plate and warm light">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181410" />
      <stop offset="0.6" stop-color="#0c0a08" />
      <stop offset="1" stop-color="#060607" />
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#f4e6cf" stop-opacity="0.42" />
      <stop offset="0.55" stop-color="#b39a76" stop-opacity="0.1" />
      <stop offset="1" stop-color="#000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="plate" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#6a6156" />
      <stop offset="0.35" stop-color="#efe7db" />
      <stop offset="0.6" stop-color="#8d8375" />
      <stop offset="1" stop-color="#2c2823" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c8b491" />
      <stop offset="0.5" stop-color="#f7ead2" />
      <stop offset="1" stop-color="#7d6c52" />
    </linearGradient>
    <filter id="grain2">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="14" /></filter>
  </defs>

  <rect width="1200" height="1500" fill="url(#bg2)" />
  <rect width="1200" height="1500" fill="url(#spot)" />

  <!-- table plane -->
  <rect x="0" y="1080" width="1200" height="420" fill="#0a0908" />
  <line x1="0" y1="1080" x2="1200" y2="1080" stroke="#c8b491" stroke-opacity="0.25" stroke-width="2" />

  <!-- plate stack -->
  <g transform="translate(600 940)">
    <ellipse cx="0" cy="150" rx="330" ry="86" fill="#000" opacity="0.55" filter="url(#blur2)" />
    <ellipse cx="0" cy="60" rx="330" ry="96" fill="url(#plate)" opacity="0.5" />
    <ellipse cx="0" cy="20" rx="296" ry="86" fill="url(#plate)" />
    <ellipse cx="0" cy="20" rx="200" ry="57" fill="none" stroke="url(#ring)" stroke-width="3" opacity="0.85" />
    <ellipse cx="0" cy="12" rx="120" ry="34" fill="#191510" />
    <ellipse cx="-22" cy="4" rx="52" ry="17" fill="#e9d9ba" opacity="0.75" />
  </g>

  <!-- cutlery lines -->
  <g stroke="url(#ring)" stroke-width="6" stroke-linecap="round" opacity="0.75">
    <line x1="150" y1="720" x2="190" y2="1160" />
    <line x1="1030" y1="760" x2="1000" y2="1180" />
  </g>

  <!-- rising steam -->
  <g fill="none" stroke="#efe7db" stroke-opacity="0.2" stroke-width="3" stroke-linecap="round">
    <path d="M540 640 q40 -80 0 -160 q-40 -80 0 -160" />
    <path d="M640 620 q46 -70 0 -140 q-46 -70 0 -140" opacity="0.7" />
    <path d="M590 600 q30 -60 0 -120" opacity="0.5" />
  </g>

  <!-- glass silhouette -->
  <g opacity="0.5">
    <path d="M860 320 h160 l-24 190 a56 56 0 0 1 -112 0 Z" fill="none" stroke="#efe7db" stroke-opacity="0.5" stroke-width="3" />
    <line x1="940" y1="560" x2="940" y2="700" stroke="#efe7db" stroke-opacity="0.5" stroke-width="3" />
    <line x1="896" y1="704" x2="984" y2="704" stroke="#efe7db" stroke-opacity="0.5" stroke-width="3" />
  </g>

  <rect width="1200" height="1500" filter="url(#grain2)" opacity="0.07" />
</svg>
